name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run build
      - name: Verify public product export
        run: node scripts/export-shareable.mjs --destination "$RUNNER_TEMP/openbot-shareable" --repository "$GITHUB_REPOSITORY"
      - name: Scan public source for private state
        run: node scripts/public-audit.mjs "$RUNNER_TEMP/openbot-shareable"
      - name: Scan the repository before export normalization
        run: node scripts/public-audit.mjs .
      - run: npm test
      - run: npm run typecheck
      - run: python3 -m unittest discover -s recovery/hooks -p 'test_*.py'
      - run: python3 -m unittest discover -s recovery/desktop-sidebar-authority -p 'test_*.py'
      - run: python3 -m pip install -r recovery/hooks/requirements-standalone-proxy.txt
      - run: python3 recovery/hooks/standalone-proxy-check.py
