[Service]
# Let the Electron main process close its children before systemd stops them.
KillMode=mixed
ExecStartPre=-/usr/bin/sudo -n /usr/bin/env GROKBOT_ASAR_PATCH_BACKUPS=%h/.local/share/openbot/desktop-sidebar-backups "GROKBOT_CODE_CACHE_DIR=%h/.config/Grok Bot/v8-code-cache" /usr/bin/python3 %h/.local/share/openbot/desktop-sidebar-recovery/patch-temporal-sidebar-preferences.py
